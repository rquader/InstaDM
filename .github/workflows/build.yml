name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Typecheck Swift sources
        run: swiftc -typecheck -target arm64-apple-macos14.0 InstaDM/*.swift

      - name: Build (Debug, unsigned)
        run: |
          xcodebuild \
            -project InstaDM.xcodeproj \
            -scheme InstaDM \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
